# Q4 part 3 — the same Deployment, updated to v2.
#
# Changes from deployment.yaml, all in one apply so they land as ONE revision:
#   1. image spam-api:multi -> spam-api:v2   (the code change: /healthz now also
#      reports which pod and node served the request)
#   2. APP_VERSION env v1 -> v2
#   3. change-cause annotation, so `kubectl rollout history` explains revision 2
#   4. a short preStop sleep, so a pod being retired keeps serving while
#      kube-proxy on every node removes it from the Service's endpoints —
#      closes the small window where a request could still be routed to a
#      pod that has already begun shutting down.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-api
  labels:
    app: spam-api
  annotations:
    kubernetes.io/change-cause: "v2: /healthz reports served_by pod + node (image spam-api:v2)"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spam-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # never drop below 2 ready pods during a rollout
      maxSurge: 1            # bring up one extra, wait for ready, then retire an old one
  template:
    metadata:
      labels:
        app: spam-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: spam-api:v2
          imagePullPolicy: IfNotPresent   # image is side-loaded via `minikube image load`
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v2"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
